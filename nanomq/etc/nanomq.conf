listeners.ssl {
    bind = "0.0.0.0:8883"
    keyfile = "/home/<username>/Documents/PlatformIO/Projects/nanomq/etc/server_pkcs1.key"
    certfile = "/home/<username>/Documents/PlatformIO/Projects/nanomq/etc/server.crt"
    cacertfile = "/home/<username>/Documents/PlatformIO/Projects/nanomq/etc/ca.crt"
    verify_peer = false
    fail_if_no_peer_cert = false
    listeners.tcp.default.bind = "0.0.0.0:1883"
    log.level = "error"
}

auth {
    allow_anonymous = true
}
